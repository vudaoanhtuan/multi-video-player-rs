[package]
name = "multi-video-player"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Multi-camera synced video player"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "clipboard"] }
egui = "0.37"
egui-wgpu = "0.37"
# SVG loader for the icons in assets/icons.
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
# Draws the app icon from its SVG file. egui_extras uses the same crate for the control bar icons.
resvg = { version = "0.45", default-features = false }
# Static link to the FFmpeg that scripts/build-ffmpeg.sh builds. See .cargo/config.toml.
ffmpeg-sys-next = { version = "9.1", default-features = false, features = ["avcodec", "avformat", "swscale", "static"] }
rfd = "0.18"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1", features = ["derive"] }
# The settings file is JSON. See src/ui/settings.rs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Development tool: scripted input and window pictures. See src/ui/selftest.rs.
selftest = []

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
# Direct3D types for the zero-copy frame import. The version must be the
# version that wgpu-hal uses, because the two crates exchange these types.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
# build.rs draws the app icon and puts it in the executable.
resvg = { version = "0.45", default-features = false }
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
