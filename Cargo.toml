[package]
name = "video-player"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Multi-camera synced video player"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.37"
egui-wgpu = "0.37"
ffmpeg-sys-next = { version = "9.1", default-features = false, features = ["avcodec", "avformat", "swscale"] }
rfd = "0.18"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1", features = ["derive"] }

[features]
# Link FFmpeg into the executable. Needs FFMPEG_DIR to point to a static
# FFmpeg. Use scripts/bundle-macos.sh, which sets all of this.
static-ffmpeg = ["ffmpeg-sys-next/static"]
# Development tool: scripted input and window pictures. See src/ui/selftest.rs.
selftest = []

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
